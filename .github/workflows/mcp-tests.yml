name: MCP checks
on:
  push:
    branches: ["feat/mcp-personal-assistant"]
  pull_request:
jobs:
  test-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: python -m pip install "mcp>=1.10,<3"
      - name: Compile Python code
        run: python -m compileall -q assistant.py fduplex_agent.py fduplex_mcp.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
